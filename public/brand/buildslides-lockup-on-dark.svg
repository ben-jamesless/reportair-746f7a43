<!--
  BuildSlides horizontal lockup — for DARK backgrounds.
  Use in: dark ink sidebar, sign-in page LEFT panel (dark).
  Wordmark fill is paper-coloured.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40" role="img" aria-label="BuildSlides">
  <rect x="0" y="4" width="32" height="32" rx="7" fill="#D94F2A"/>
  <rect x="7"  y="13.5" width="14" height="9" rx="1.6" fill="#FFFFFF" opacity="0.55"/>
  <rect x="11" y="17.5" width="14" height="9" rx="1.6" fill="#FFFFFF"/>
  <text x="44" y="27"
        font-family="'DM Sans', Inter, system-ui, sans-serif"
        font-weight="700"
        font-size="20"
        letter-spacing="-0.4"
        fill="#F4F1EA">BuildSlides</text>
</svg>
