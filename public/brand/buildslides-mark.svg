<!--
  BuildSlides square mark — universal icon.
  Use anywhere a square logo is needed: sidebar mark, app tile, favicon variants.
  Drop into your <Logo /> component as inline SVG so currentColor works if you swap tile.
  Viewbox 32×32. Scales perfectly to any size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="BuildSlides">
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#D94F2A"/>
  <!-- Two stacked slide rectangles, white, slightly offset -->
  <rect x="7" y="9.5"  width="14" height="9" rx="1.6" fill="#FFFFFF" opacity="0.55"/>
  <rect x="11" y="13.5" width="14" height="9" rx="1.6" fill="#FFFFFF"/>
</svg>
